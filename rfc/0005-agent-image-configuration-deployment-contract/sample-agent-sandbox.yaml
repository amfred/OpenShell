kind: Sandbox
metadata:
  name: sample-codex
  namespace: sample-agents
  labels:
    app.kubernetes.io/name: sample-codex
spec:
  service: true
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: sample-codex
    spec:
      runtimeClassName: kata
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: prepare-profile-paths
        image: ghcr.io/nvidia/openshell-community/sandboxes/base:latest
        imagePullPolicy: IfNotPresent
