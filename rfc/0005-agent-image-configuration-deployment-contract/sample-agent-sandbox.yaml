          subPath: AGENTS.md
          readOnly: true
        - name: codex-config
          mountPath: /sandbox/.codex/config.toml
          subPath: config.toml
          readOnly: true
        - name: skill1
          mountPath: /sandbox/workspace/.agents/skills/skill1
          subPath: skills/skill1
          readOnly: true
        - name: skill2
          mountPath: /sandbox/workspace/.agents/skills/skill2
          subPath: skills/skill2
          readOnly: true
        - name: skill3
          mountPath: /sandbox/workspace/.agents/skills/skill3
          subPath: skills/skill3
          readOnly: true
      volumes:
      - name: workspace
        emptyDir: {}
      - name: codex-home
        emptyDir: {}
      - name: codex-instructions
        configMap:
          name: sample-codex-instructions
          items:
          - key: AGENTS.md
            path: AGENTS.md
      - name: codex-config
        configMap:
          name: sample-codex-config
          items:
          - key: config.toml
            path: config.toml
      - name: skill1
        image:
          reference: ghcr.io/example/skills/skill1:v1
          pullPolicy: IfNotPresent
      - name: skill2
        image:
          reference: ghcr.io/example/skills/skill2:v1
          pullPolicy: IfNotPresent
      - name: skill3
        image:
          reference: ghcr.io/example/skills/skill3:v1
          pullPolicy: IfNotPresent
